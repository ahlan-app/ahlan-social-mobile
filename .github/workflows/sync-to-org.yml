name: Sync to Ahlan Org

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # This repo is public: the default token is enough to read it. It must
          # not stay configured, or it would be sent to the org push as well.
          persist-credentials: false

      - name: Push to ahlan-app org
        env:
          GIT_TERMINAL_PROMPT: 0
          ORG_SYNC_PAT: ${{ secrets.ORG_SYNC_PAT }}
        run: |
          if [ -z "$ORG_SYNC_PAT" ]; then
            echo "::error::ORG_SYNC_PAT secret is missing"
            exit 1
          fi
          git push "https://x-access-token:${ORG_SYNC_PAT}@github.com/ahlan-app/ahlan-social-mobile.git" HEAD:refs/heads/main --force
